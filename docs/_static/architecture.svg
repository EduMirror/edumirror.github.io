<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">EduMirror research workflow</title>
  <desc id="desc">Research question flows through scenario design, agent configuration, baseline and intervention simulation, and results analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#e9f1f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#163a43" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#267d78"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="62" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#163a43">从研究问题到可追溯结果</text>
  <text x="63" y="88" font-family="sans-serif" font-size="16" fill="#557078">EduMirror 将设计、运行、干预和测量放在同一条实验工作流中</text>
  <g font-family="sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(55 145)">
      <rect width="190" height="128" rx="18" fill="#ffffff"/>
      <circle cx="38" cy="38" r="20" fill="#f3bd4b"/>
      <text x="38" y="45" font-size="20" font-weight="700" fill="#163a43">?</text>
      <text x="95" y="42" font-size="18" font-weight="700" fill="#163a43">研究问题</text>
      <text x="95" y="77" font-size="14" fill="#557078">主题、冲突、假设</text>
      <text x="95" y="99" font-size="14" fill="#557078">和关注结果</text>
    </g>
    <g transform="translate(285 145)">
      <rect width="190" height="128" rx="18" fill="#ffffff"/>
      <circle cx="38" cy="38" r="20" fill="#8dc7bf"/>
      <text x="38" y="45" font-size="18" font-weight="700" fill="#163a43">01</text>
      <text x="95" y="42" font-size="18" font-weight="700" fill="#163a43">场景设计</text>
      <text x="95" y="77" font-size="14" fill="#557078">角色、场景、</text>
      <text x="95" y="99" font-size="14" fill="#557078">条件和测量</text>
    </g>
    <g transform="translate(515 145)">
      <rect width="190" height="128" rx="18" fill="#ffffff"/>
      <circle cx="38" cy="38" r="20" fill="#8dc7bf"/>
      <text x="38" y="45" font-size="18" font-weight="700" fill="#163a43">02</text>
      <text x="95" y="42" font-size="18" font-weight="700" fill="#163a43">角色配置</text>
      <text x="95" y="77" font-size="14" fill="#557078">目标、记忆、特征</text>
      <text x="95" y="99" font-size="14" fill="#557078">和价值取向</text>
    </g>
    <g transform="translate(745 145)">
      <rect width="190" height="128" rx="18" fill="#ffffff"/>
      <circle cx="38" cy="38" r="20" fill="#f3bd4b"/>
      <text x="38" y="45" font-size="18" font-weight="700" fill="#163a43">03</text>
      <text x="95" y="42" font-size="18" font-weight="700" fill="#163a43">模拟运行</text>
      <text x="95" y="77" font-size="14" fill="#557078">基准条件与</text>
      <text x="95" y="99" font-size="14" fill="#557078">干预条件</text>
    </g>
    <g transform="translate(975 145)">
      <rect width="170" height="128" rx="18" fill="#163a43"/>
      <circle cx="38" cy="38" r="20" fill="#8dc7bf"/>
      <text x="38" y="45" font-size="18" font-weight="700" fill="#163a43">04</text>
      <text x="85" y="42" font-size="18" font-weight="700" fill="#ffffff">结果分析</text>
      <text x="85" y="77" font-size="14" fill="#d9ebe8">日志、Surveyor、</text>
      <text x="85" y="99" font-size="14" fill="#d9ebe8">Rater 和媒体</text>
    </g>
  </g>
  <g stroke="#267d78" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M245 209 H280"/>
    <path d="M475 209 H510"/>
    <path d="M705 209 H740"/>
    <path d="M935 209 H970"/>
  </g>
  <path d="M840 294 C840 350 380 350 380 294" fill="none" stroke="#d39a2c" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="610" y="375" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#82621d">结果可回溯到当次运行保存的配置快照</text>
</svg>
